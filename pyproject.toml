[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p12-helios-recovery"
version = "0.1.0"
description = "Reproducible, hardware-safe recovery pipeline for the QAT P12 peaked circuit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "networkx>=3.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
quantum = [
  "pytket>=2.18",
  "pytket-quantinuum>=0.56",
  "pytket-qir>=2.0,<3",
  "qnexus>=0.46,<0.47",
]
qiskit = ["qiskit>=1.2", "pytket-qiskit>=0.60"]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
p12-recovery = "p12_recovery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/p12_recovery"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "offline: requires no network or credentials",
  "integration: requires optional SDK packages",
  "hardware: never included in the default suite",
]

[tool.coverage.run]
source = ["p12_recovery"]
omit = [
  "src/p12_recovery/acquisition.py",
  "src/p12_recovery/backends/*.py",
  "src/p12_recovery/cli.py",
  "src/p12_recovery/compilation.py",
  "src/p12_recovery/logging_utils.py",
  "src/p12_recovery/nexus_cost.py",
  "src/p12_recovery/nexus_emulator.py",
  "src/p12_recovery/readiness.py",
  "src/p12_recovery/reporting.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["p12_recovery"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "pandas.*",
  "matplotlib.*",
  "networkx.*",
  "pytket.*",
  "qnexus.*",
]
ignore_missing_imports = true
