name: peaked-circuit-review

on: [push, pull_request]

jobs:
  offline-review-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/verify_tracker_packages.py
      - run: python tools/reproduce_tracker_recovery.py
      - run: python tools/run_tracker_classical_audit.py p11 p12
