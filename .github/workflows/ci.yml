name: peaked_circuits-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peaked-circuits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-review-checks:
    name: Offline package and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -e .
          python -m pip check

      - name: Verify packaged evidence and checksums
        run: python tools/verify_tracker_packages.py

      - name: Reproduce target-blind recovery
        run: python tools/reproduce_tracker_recovery.py

      - name: Measure local classical audit
        run: python tools/run_tracker_classical_audit.py p11 p12
